spring.application.name=dependencyvisualizer

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/dependency_visualizer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=2001


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server Configuration
# ===============================
server.port=8085

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Custom Upload Directory
# ===============================
file.upload-dir=C:/project/uploads

# ===============================
# JWT Configuration
# ===============================
jwt.secret=3d7f8a2b1c4e6f9a0b3d5e7c9f1a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6a
jwt.expiration=86400000